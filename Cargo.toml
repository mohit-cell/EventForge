[package]
name = "eventforge"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
publish = false

[dependencies]
anyhow = "1.0"
memchr = "2.7"
memmap2 = "0.9"
parquet = { version = "=56.2.0", default-features = false, features = ["snap"] }
rayon = "1.10"
rustc-hash = "2.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"

[profile.release]
codegen-units = 8
debug = false
strip = true
